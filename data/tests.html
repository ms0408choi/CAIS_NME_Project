<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Balance | Data tests</title>
  <style>
    body { margin: 2rem auto; padding: 0 1rem; max-width: 52rem; font: 1rem/1.5 system-ui, sans-serif; }
    li { margin-bottom: .5rem; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Review Balance data tests</h1>
  <p>These checks use November 4, 2026 as the evaluation date cutoff.</p>
  <p id="summary" role="status">Running tests…</p>
  <ol id="results"></ol>
  <script src="clean.js"></script>
  <script src="schema.js"></script>
  <script src="validate.js"></script>
  <script src="test-data.js"></script>
  <script src="tests.js"></script>
  <script>
    const results = runDataTests();
    document.getElementById('summary').textContent =
      results.filter(result => result.passed).length + ' of ' + results.length + ' tests pass.';
    for (const result of results) {
      const item = document.createElement('li');
      item.textContent = (result.passed ? 'Pass — ' : 'Fail — ') + result.name;
      if (!result.passed) {
        item.textContent += '. Expected ' + JSON.stringify(result.expected) + ', got ' + JSON.stringify(result.actual);
      }
      document.getElementById('results').append(item);
    }
  </script>
</body>
</html>
